<style>
body {

}

h1 {

    margin-top: 20px;
    color: black;
}

    margin: 20px;

}

    background: #9ca3af;

<h1>EL GOZO DE MI VIDA</h1>

<div class="letra">
El gozo de mi vida, ¡oh, fuego consumidor!
la Rosa de Sarón y el Señor de Paz.
