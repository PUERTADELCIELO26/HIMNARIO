<!DOCTYPE html>
<html>
<head>
    <title>YO POR MEDIO DE TI</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>YO POR MEDIO DE TI</h1>

<div class="letra">
YO POR MEDIO DE TI 

Yo por medio de ti puedo
entrar al Santo Lugar
Yo por medio de ti puedo
entrar al Santo Lugar

Por la sangre de Cristo y la gracia
de Dios somos redimidos por él
Por la sangre de Cristo y la gracia
de Dios somos redimidos por él

</div>

<button onclick="history.back()">⬅️ Volver</button>

</body>
</html>
