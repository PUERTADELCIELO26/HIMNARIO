<!DOCTYPE html>
<html>
<head>
    <title>TE AMO REY</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>TE AMO REY</h1>

<div class="letra">
TE AMO REY

Te amo Rey
Y levanto mi voz
Para adorar y gozarme en ti

Regocíjate
Y escucha mi voz
Que sea un dulce sonar 
Para Ti //

CORO

Alza tu voz
Al Señor y Rey 
Póstrate y adórale 
Cantad, Cantad

A su majestad
Todos adorad
Dadle honra, dadle gloria,
A Cristo Dios mi Rey 

</div>

<button onclick="history.back()">⬅️ Volver</button>

</body>
</html>
