<!DOCTYPE html>
<html>
<head>
    <title>CRISTO QUIERO CAMINAR SIEMPRE CONTIGO</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>CRISTO QUIERO CAMINAR SIEMPRE CONTIGO</h1>

<div class="letra">
Cristo quiero caminar siempre contigo
y tomarte fuerte de la mano
y sentir tu fortaleza en mi

porque en Ti se encuentra
toda fuerza de victoria
Porque el santo nombre
de Jesús me liberó
Porque en Cristo mi carga es ligera
Porque en Cristo mi carga es ligera
</div>

<button onclick="history.back()">⬅ Volver</button>

</body>
</html>
