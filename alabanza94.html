<!DOCTYPE html>
<html>
<head>
    <title>TU ME HACES TAN FELIZ</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>TU ME HACES TAN FELIZ</h1>

<div class="letra">
TU ME HACES TAN FELIZ 

Tú me haces tan feliz
Tú me haces tan feliz
Tú me haces tan feliz

Mi corazón se alegra en ti

Aleluya, aleluya, aleluya
Jesús me haces tan feliz

</div>

<button onclick="history.back()">⬅️ Volver</button>

</body>
</html>
