<!DOCTYPE html>
<html>
<head>
    <title>MIL GRACIAS</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>MIL GRACIAS</h1>

<div class="letra">
Mil gracias yo te doy, Señor
Mil gracias de mi corazón
Mil gracias porque has enviado
A Jesús por mí

\\Y hoy, el débil diga: Fuerte soy
El pobre diga: Rico soy
Por lo que Dios ha hecho por mí
Y en mí//
</div>
