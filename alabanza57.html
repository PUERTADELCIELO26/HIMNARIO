<!DOCTYPE html>
<html>
<head>
    <title>LEVANTO MIS MANOS</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>LEVANTO MIS MANOS</h1>

<div class="letra">
Levanto mis manos
Aunque no tenga fuerzas
Levanto mis manos
Aunque tenga mil problemas

Cuando levanto mis manos
Comienzo a sentir
Una unción que me hace cantar

Cuando levanto mis manos
Comienzo a sentir
El fuego

Cuando levanto mis manos
Mis cargas se van
Nuevas fuerzas, Tú me das
</div>
