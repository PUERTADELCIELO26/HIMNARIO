<!DOCTYPE html>
<html>
<head>
    <title>ESCUDRIÑEMOS</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>ESCUDRIÑEMOS</h1>

<div class="letra">

Escudriñemos nuestros caminos Y volvamos Jehová

Levantemos nuestras manos al Dios de los cielos
              Y
volvamos a Jehová nuestro Dios

 ∕∕ Por la bondad de Jehová No hemos sido consumidos   Porque nunca decayó su bondad

Nuevas son cada mañana 

Nuevas son cada mañana
          Y 
grande es su fidelidad ∕∕


</div>

<button onclick="history.back()">⬅ Volver</button>

</body>
</html>
