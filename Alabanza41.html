<!DOCTYPE html>
<html>
<head>
    <title>EXALTATE (Al BORDE DE TU GRAN TRONO)

</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>EXALTATE (Al BORDE DE TU GRAN TRONO)

</h1>

<div class="letra">
∕∕ Al borde De Tu gran trono Me postraré  
 Hoy a Ti
Tú reinas Sobre principados Sentado
A la diestra de Dios
Exáltate
Oh, gran Cordero
Tú vives hoy Y vivirás
Corónate Con mi alabanza
Tu nombre es El vencedor ∕∕



</div>

<button onclick="history.back()">⬅ Volver</button>

</body>
</html>
