<!DOCTYPE html>
<html>
<head>
    <title>BENDECIRE A JEHOVÁ EN TODO TIEMPO(SALMOS34)</title>
</head>

<style>
body {
    font-family: Calibri, Arial, sans-serif;
    background: #f8f9fa;
    margin: 0;
    text-align: center;
}

/* TITULO */
h1 {
    font-size: 17px;
    margin-top: 20px;
    color: black;
}

/* CONTENEDOR DE LETRA */
.letra {
    max-width: 600px;
    margin: 20px auto;
    background: #e5e7eb; /* gris suave */
    padding: 20px;
    border-radius: 10px;
    font-size: 15px;
    color: black;
    line-height: 1.8;
    text-align: center;
    white-space: pre-line; /* respeta saltos de línea */
}

/* BOTON */
button {
    margin: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #d1d5db;
    color: black;
    cursor: pointer;
}

button:hover {
    background: #9ca3af;
}
</style>

<body>

<h1>BENDECIRE A JEHOVÁ EN TODO TIEMPO(SALMOS34)</h1>

<div class="letra">
Bendeciré a Jehová
En todo tiempo

Su alabanza en mi boca estará
En Jehová se gloriará mi alma
Lo oirán los mansos y se alegrarán

Engrandeced a Jehová conmigo
Ensalcemos aún a su nombre

Busqué a Jehová 
Y él me oyó 
Y de todos mis temores 
Me libró.
</div>

<button onclick="history.back()">⬅️ Volver</button>

</body>
</html>
